# Separate, opt-in trial; does not publish TURN or change the local/public stacks.
# docker compose --env-file .env.tunnel -p webrtc-tunnel -f docker-compose.tunnel.yml up -d
services:
  signaling:
    build: .
    image: webrtc-signaling:local
    restart: "no"
    ports: ["127.0.0.1:3001:3000"]
    environment:
      PORT: "3000"
      MAX_VIEWERS: "${MAX_VIEWERS:-10}"
      ACCESS_KEY: "${ACCESS_KEY:?set a random ACCESS_KEY in .env.tunnel}"
      CORS_ORIGIN: "${CORS_ORIGIN:?set the actual tunnel HTTPS origin}"
      TURN_HOST: ""
      TURN_SECRET: ""
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: "no"
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://signaling:3000"]
    depends_on:
      signaling:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
