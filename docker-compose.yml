services:
  turnserver:
    image: coturn/coturn:latest
    container_name: webrtc-turnserver
    restart: unless-stopped
    entrypoint: ["/usr/bin/turnserver"]
    command:
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}"
      - "--realm=${TURN_REALM:-webrtc.local}"
      - "--listening-ip=0.0.0.0"
      - "--listening-port=3478"
      - "--min-port=${TURN_MIN_PORT:-40000}"
      - "--max-port=${TURN_MAX_PORT:-40249}"
      - "--relay-threads=2"
      - "--external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-tls"
      - "--no-cli"
      # Local-only relay to loopback; public override removes this permission.
      - "--allow-loopback-peers"
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:${TURN_MIN_PORT:-40000}-${TURN_MAX_PORT:-40249}:${TURN_MIN_PORT:-40000}-${TURN_MAX_PORT:-40249}/udp"
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  signaling:
    build: .
    image: webrtc-signaling:local
    container_name: webrtc-signaling
    restart: unless-stopped
    depends_on: [turnserver]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      PORT: "3000"
      MAX_VIEWERS: "${MAX_VIEWERS:-10}"
      ACCESS_KEY: "${ACCESS_KEY:-}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
      TURN_HOST: "${TURN_HOST:-localhost}"
      TURN_PORT: "3478"
      TURN_SECRET: "${TURN_SECRET:?set TURN_SECRET in .env}"
      TURN_TTL_SECONDS: "${TURN_TTL_SECONDS:-3600}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging
