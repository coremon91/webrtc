# Runtime values for external-ip, realm, and static-auth-secret are supplied
# by compose.yaml from infra/coturn/.env. Never put the shared secret here.

listening-port=3478
tls-listening-port=5349

min-port=49160
max-port=49200

fingerprint
use-auth-secret
stale-nonce=600

# TLS is exposed on TCP 5349. DTLS is not used by the browser configuration.
no-dtls
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

no-cli
no-multicast-peers
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log

# Required runtime equivalents supplied by compose.yaml:
# external-ip=<public-ip>[/<private-ip>]
# realm=turn.<service-domain>
# static-auth-secret=<secret-manager-or-environment-value>
