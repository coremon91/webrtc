<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Low-latency P2P</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .header .title {
        font-size: 20px;
        font-weight: 700;
      }
      .header .who {
        font-size: 13px;
        opacity: 0.8;
        margin-top: 4px;
      }
      .create-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: end;
      }
      .create-row label {
        flex: 1 1 200px;
      }
      .create-row label span {
        display: block;
        margin-bottom: 6px;
      }
      .create-row input {
        width: 100%;
      }
      .room {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        margin-bottom: 10px;
      }
      .room .meta-line {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 6px;
      }
      .room .roomId {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        opacity: 0.75;
        word-break: break-all;
      }
      .urlrow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .urlrow .urllabel {
        font-size: 12px;
        opacity: 0.7;
        min-width: 64px;
      }
      .urlrow input {
        flex: 1 1 360px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .small {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 10px;
      }
      .btn-danger {
        background: linear-gradient(135deg, rgba(255, 100, 110, 0.55), rgba(200, 80, 90, 0.4));
        border: 1px solid rgba(255, 160, 170, 0.3);
      }
      .empty {
        opacity: 0.6;
        font-size: 13px;
        padding: 12px;
        text-align: center;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: rgba(20, 30, 60, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.18s, transform 0.18s;
        pointer-events: none;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div>
          <div class="title">관리자 대시보드</div>
          <div class="who" id="who">로그인 확인 중…</div>
        </div>
        <div class="row" style="gap: 8px">
          <button id="btnRefresh" class="small">새로고침</button>
          <button id="btnLogout" class="small btn-danger">로그아웃</button>
        </div>
      </div>

      <div class="card">
        <div style="font-weight: 650; margin-bottom: 10px">새 송출 방 만들기</div>
        <form id="createForm" class="create-row">
          <label>
            <span>제목 (선택)</span>
            <input id="title" placeholder="예: 4월 정기 세미나" />
          </label>
          <label>
            <span>방 비밀번호 (선택, 시청자에게 요구)</span>
            <input id="password" placeholder="비워두면 비밀번호 없음" />
          </label>
          <div>
            <button id="btnCreate" type="submit">[새 송출 방 만들기]</button>
          </div>
        </form>
      </div>

      <div style="height: 14px"></div>

      <div class="card">
        <div style="font-weight: 650; margin-bottom: 10px">방 목록</div>
        <div id="rooms"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const roomsEl = $("rooms");
      const toastEl = $("toast");

      /** LAN/IP 시청 링크 (서버 `publicOrigin`) */
      let watchBaseOrigin = "";
      /** 외부 HTTPS 시청 링크 (서버 `publicHttpsOrigin`) */
      let watchHttpsOrigin = "";

      function watchLinkOrigin() {
        return watchBaseOrigin || location.origin;
      }

      function watchUrlHttps(roomId) {
        if (!watchHttpsOrigin) return "";
        return `${watchHttpsOrigin}/watch/${roomId}`;
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1500);
      }

      function publishUrl(roomId) {
        return `${location.origin}/publish/${roomId}`;
      }
      function watchUrl(roomId) {
        return `${watchLinkOrigin()}/watch/${roomId}`;
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast("복사됨");
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            showToast("복사됨");
          } catch {
            showToast("복사 실패");
          }
          document.body.removeChild(ta);
        }
      }

      function renderRoom(room) {
        const wrap = document.createElement("div");
        wrap.className = "room";

        const left = document.createElement("div");
        const title = document.createElement("div");
        title.style.fontWeight = "650";
        title.textContent = room.title;
        left.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "meta-line";
        const created = new Date(room.createdAt).toLocaleString();
        meta.textContent =
          `생성 ${created}  •  ` +
          `송출자 ${room.senderActive ? "ON" : "OFF"}  •  ` +
          `시청자 ${room.viewerCount}명  •  ` +
          (room.hasPassword ? "비밀번호 있음" : "비밀번호 없음");
        left.appendChild(meta);

        const idRow = document.createElement("div");
        idRow.className = "roomId";
        idRow.textContent = `roomId = ${room.roomId}`;
        left.appendChild(idRow);

        const mkUrlRow = (label, url) => {
          const row = document.createElement("div");
          row.className = "urlrow";
          const lab = document.createElement("div");
          lab.className = "urllabel";
          lab.textContent = label;
          const inp = document.createElement("input");
          inp.value = url;
          inp.readOnly = true;
          inp.addEventListener("focus", () => inp.select());
          const copyBtn = document.createElement("button");
          copyBtn.className = "small";
          copyBtn.type = "button";
          copyBtn.textContent = "복사";
          copyBtn.addEventListener("click", () => copyText(url));
          const openBtn = document.createElement("button");
          openBtn.className = "small";
          openBtn.type = "button";
          openBtn.textContent = "열기";
          openBtn.addEventListener("click", () => window.open(url, "_blank"));
          row.appendChild(lab);
          row.appendChild(inp);
          row.appendChild(copyBtn);
          row.appendChild(openBtn);
          return row;
        };

        left.appendChild(mkUrlRow("송출자", publishUrl(room.roomId)));
        left.appendChild(mkUrlRow("시청자(ip)", watchUrl(room.roomId)));
        if (watchHttpsOrigin) {
          left.appendChild(mkUrlRow("시청자(domain)", watchUrlHttps(room.roomId)));
        }

        const right = document.createElement("div");
        const del = document.createElement("button");
        del.className = "small btn-danger";
        del.textContent = "삭제";
        del.addEventListener("click", async () => {
          if (!confirm("이 방을 삭제하시겠습니까? 송출/시청 연결이 모두 끊깁니다.")) return;
          const res = await fetch(`/api/rooms/${room.roomId}`, {
            method: "DELETE",
            credentials: "same-origin",
          });
          if (res.ok) {
            showToast("삭제됨");
            refresh();
          } else {
            showToast("삭제 실패");
          }
        });
        right.appendChild(del);

        wrap.appendChild(left);
        wrap.appendChild(right);
        return wrap;
      }

      async function refresh() {
        try {
          const res = await fetch("/api/rooms", { credentials: "same-origin" });
          if (res.status === 401) {
            location.href = "/login";
            return;
          }
          const data = await res.json();
          roomsEl.innerHTML = "";
          if (!data.rooms || data.rooms.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "아직 생성된 방이 없습니다. 위에서 새 방을 만들어 보세요.";
            roomsEl.appendChild(empty);
            return;
          }
          for (const r of data.rooms) roomsEl.appendChild(renderRoom(r));
        } catch (e) {
          showToast("목록 불러오기 실패");
        }
      }

      async function checkMe() {
        const res = await fetch("/api/me", { credentials: "same-origin" });
        const data = await res.json().catch(() => ({}));
        if (!data.isAdmin) {
          location.href = "/login";
          return false;
        }
        $("who").textContent = `로그인됨: ${data.adminUser}`;
        return true;
      }

      $("createForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = $("title").value.trim();
        const password = $("password").value.trim();
        const res = await fetch("/api/rooms", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, password }),
        });
        if (res.status === 401) {
          location.href = "/login";
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          showToast(data.error || "생성 실패");
          return;
        }
        $("title").value = "";
        $("password").value = "";
        showToast(`방 생성: ${data.room.roomId.slice(0, 8)}…`);
        refresh();
      });

      $("btnRefresh").addEventListener("click", refresh);
      $("btnLogout").addEventListener("click", async () => {
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
        location.href = "/login";
      });

      (async () => {
        if (await checkMe()) {
          try {
            const res = await fetch("/api/admin/config", {
              credentials: "same-origin",
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.ok) {
              if (data.publicOrigin) {
                watchBaseOrigin = String(data.publicOrigin).replace(/\/+$/, "");
              }
              if (data.publicHttpsOrigin) {
                watchHttpsOrigin = String(data.publicHttpsOrigin).replace(/\/+$/, "");
              }
            }
          } catch {
            showToast("시청용 주소를 불러오지 못했습니다");
          }
          refresh();
        }
      })();
    </script>
  </body>
</html>
